<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keturah Reserve — Monthly Project Report (Team)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aboreto&amp;family=Reddit+Sans:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --teal:#8F8A80; --teal-d:#4A4A4A; --teal-dd:#3A3A3A; --teal-l:#EDE9E0; --teal-xl:#F7F5F0;
  --ink:#2D2D2D; --grey-d:#4A4A4A; --grey:#8A8A8A; --grey-l:#D3CFC6; --line:#DCE3E3; --paper:#FFFFFF; --desk:#E6EBEB;
  --g:#4E8B5F; --g-l:#E2EFE5; --a:#B98A2E; --a-l:#F6ECD6; --r:#B04E3A; --r-l:#F4DFDA; --b:#4C7AA2; --b-l:#E0E9F2;
  --title:"Aboreto","Cinzel","Times New Roman",serif;
  --body:"Reddit Sans","Segoe UI",Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font:13px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- toolbar (screen only) ---------- */
.toolbar{position:sticky;top:0;z-index:50;background:var(--teal-dd);color:#fff;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.toolbar .brand{font-weight:700;font-size:15px;letter-spacing:.01em;margin-right:auto;display:flex;gap:10px;align-items:baseline;min-width:0}
.toolbar .brand small{font-weight:400;opacity:.75;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 12px;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.12)}
.tb.on{background:#fff;color:var(--teal-dd);border-color:#fff}
.tb.solid{background:var(--teal);border-color:var(--teal)}
.notice{max-width:1123px;margin:12px auto 0;padding:10px 14px;border-left:4px solid var(--teal);background:#fff;font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice.warn{border-left-color:var(--a)}
.notice button{border:1px solid var(--line);background:var(--teal-xl);padding:5px 10px;border-radius:3px;cursor:pointer;font-weight:600}
.editbar{max-width:1123px;margin:12px auto 0;padding:10px 14px;background:var(--a-l);border-left:4px solid var(--a);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.editbar label{display:flex;gap:6px;align-items:center}

/* ---------- pages ---------- */
#app{padding:16px 16px 60px;counter-reset:pg}
.page{counter-increment:pg;position:relative;background:var(--paper);width:100%;max-width:1123px;min-height:794px;margin:16px auto;padding:34px 44px 56px;box-shadow:0 2px 14px rgba(45,45,45,.12);display:flex;flex-direction:column;gap:16px;overflow:hidden}
.ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.ph h2{margin:4px 0 0;font:400 25px/1.15 var(--title);color:var(--teal-dd);letter-spacing:.02em;text-wrap:balance}
.ph .sub{color:var(--grey);margin-top:4px;font-size:12.5px;max-width:70ch}
.ph .meta{text-align:right;font-size:11px;color:var(--grey);line-height:1.5;flex:none}
.ph .meta b{color:var(--ink);font-weight:600}
.ph .logo{max-height:34px;max-width:120px;display:block;margin:0 0 6px auto}
.pf{position:absolute;left:44px;right:44px;bottom:16px;display:flex;justify-content:space-between;font-size:10px;color:var(--grey);border-top:1px solid var(--line);padding-top:7px}
.pf .wm{font-weight:700;color:var(--teal-d)}
.pf .pn::after{content:counter(pg)}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{border:1px solid var(--line);background:var(--paper);padding:14px 16px;min-width:0}
.card.tint{background:var(--teal-xl)}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-d);font-weight:700}
.kpi{border:1px solid var(--line);border-top:3px solid var(--teal);padding:11px 13px 12px;background:var(--paper);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
.kpi .v{font-size:25px;font-weight:700;line-height:1.1;color:var(--teal-dd);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:600;color:var(--grey)}
.kpi .n{font-size:11px;color:var(--grey-d)}
.kpi.g{border-top-color:var(--g)} .kpi.g .v{color:var(--g)}
.kpi.a{border-top-color:var(--a)} .kpi.a .v{color:var(--a)}
.kpi.r{border-top-color:var(--r)} .kpi.r .v{color:var(--r)}
.kpi.b{border-top-color:var(--b)} .kpi.b .v{color:var(--b)}
.kpi.na .v{color:var(--grey-l)}
.bar{height:6px;background:var(--teal-l);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.two{position:relative}
.bar.two i.p{position:absolute;inset:0 auto 0 0;background:var(--grey-l)}
.bar.two i.x{position:absolute;inset:0 auto 0 0}

table{border-collapse:collapse;width:100%;font-size:11.5px}
thead th{background:var(--teal-dd);color:#fff;text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.04em;padding:7px 8px;vertical-align:bottom}
thead th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even) td{background:#FAFCFC}
tr.sub td{background:var(--teal-l)!important;font-weight:700}
tr.grp td{background:var(--teal-xl)!important;font-weight:700;color:var(--teal-dd);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.tw{overflow-x:auto;min-width:0}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pill.g{background:var(--g-l);color:var(--g)} .pill.a{background:var(--a-l);color:var(--a)} .pill.r{background:var(--r-l);color:var(--r)} .pill.b{background:var(--b-l);color:var(--b)} .pill.n{background:#F1EEE7;color:var(--grey-d)}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--teal);color:var(--teal-d);font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:2px}
.score{display:inline-block;min-width:28px;text-align:center;font-weight:700;padding:2px 6px;border-radius:3px}
.score.h{background:var(--r-l);color:var(--r)} .score.m{background:var(--a-l);color:var(--a)} .score.l{background:var(--g-l);color:var(--g)}
.muted{color:var(--grey)}
.small{font-size:11px}
.note{font-size:10.5px;color:var(--grey);font-style:italic}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 14px;font-size:12.5px}
.dl dt{color:var(--grey);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.dl dd{margin:0;font-weight:600}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin:2px 0}
.empty{border:1px dashed var(--grey-l);padding:22px;text-align:center;color:var(--grey);background:var(--teal-xl)}
.rag{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.rag.g{background:var(--g)} .rag.a{background:var(--a)} .rag.r{background:var(--r)} .rag.n{background:var(--grey-l)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--grey-d)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg text{font-family:var(--body)}

/* cover */
.cover{padding:0;flex-direction:row;gap:0}
.cover .cl{width:42%;background:var(--teal-dd);color:#fff;padding:44px 40px;display:flex;flex-direction:column;gap:18px}
.cover .cr{flex:1;background:linear-gradient(160deg,var(--teal) 0%,var(--teal-d) 100%);background-size:cover;background-position:center;position:relative;min-height:794px}
.cover .cr .ov{position:absolute;inset:auto 0 0 0;padding:26px 36px;background:linear-gradient(transparent,rgba(20,40,42,.85));color:#fff}
.wordmark{font:700 30px/1 var(--body);letter-spacing:-.01em}
.wordmark span{font-weight:400;color:var(--teal-l)}
.cover .logos{display:flex;gap:12px;align-items:center;min-height:40px}
.cover .logos img{max-height:46px;max-width:150px;background:#fff;padding:4px}
.cover h1{font:400 34px/1.15 var(--title);margin:auto 0 0;letter-spacing:.02em;text-wrap:balance}
.cover .proj{font-size:20px;font-weight:600;color:var(--teal-l)}
.cover .period{font-size:14px;opacity:.9}
.cover .chips{display:flex;gap:8px;flex-wrap:wrap}
.cover .chips span{border:1px solid rgba(255,255,255,.5);padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.08em}
.cover .foot{font-size:11px;opacity:.8;border-top:1px solid rgba(255,255,255,.25);padding-top:12px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}

.toc{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;max-width:820px;margin-top:10px}
.toc a{display:flex;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.toc a b{color:var(--teal);width:20px;font-size:15px}
.stake{border:1px solid var(--line);border-left:4px solid var(--teal);padding:14px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stake .r{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.stake .c{font-size:16px;font-weight:700}
.stake .s{font-size:12px;color:var(--grey-d);border-top:1px solid var(--line);padding-top:6px}
.issue{border:1px solid var(--line);border-top:3px solid var(--a);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;break-inside:avoid}
.issue h4{margin:0;font-size:13.5px;color:var(--teal-dd)}
.issue .act{font-size:12px} .issue .act b{color:var(--ink)}
.issue .by{font-size:10.5px;color:var(--grey);font-style:italic;margin-top:auto}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photo{border:1px solid var(--line);background:var(--teal-xl);display:flex;flex-direction:column;min-width:0;break-inside:avoid}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.photo .cap{padding:6px 8px;font-size:11px}
.sig{border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.sig .line{margin-top:auto;border-top:1px solid var(--ink);padding-top:4px;font-size:10.5px;color:var(--grey)}

/* ---------- edit mode ---------- */
.ed{width:100%;min-width:0;border:1px solid var(--grey-l);background:#FFFDF6;padding:3px 6px;border-radius:2px;font-size:inherit;font-weight:inherit;line-height:1.35}
textarea.ed{min-height:52px;resize:vertical;font-weight:400}
input.ed.num{text-align:right}
.rowtools{display:flex;gap:6px;margin-top:6px}
.addbtn,.delbtn,.upbtn{border:1px dashed var(--teal);background:var(--teal-xl);color:var(--teal-dd);padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer;border-radius:3px}
.delbtn{border-color:var(--r);color:var(--r);background:var(--r-l);padding:2px 7px}
.only-edit{display:none}
body.editing .only-edit{display:revert}
body.editing .only-view{display:none}

/* ---------- responsive ---------- */
@media screen and (max-width:900px){
  .grid.g2{grid-template-columns:minmax(0,1fr)!important}
  .g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:24px 18px 52px;min-height:0}
  .pf{left:18px;right:18px}
  .cover{flex-direction:column}
  .cover .cl{width:100%}
  .cover .cr{min-height:260px}
  .toc{grid-template-columns:1fr}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media screen and (max-width:560px){
  .grid{grid-template-columns:minmax(0,1fr)!important}
  .toolbar{position:static}
  .tb{padding:6px 9px}
  .g2,.g3,.g4,.g5,.g6{grid-template-columns:minmax(0,1fr)}
  #app{padding:8px 8px 40px}
  .dl{grid-template-columns:1fr}
  .ph{flex-direction:column}
  .ph .meta{text-align:left}
}

/* ---------- print / PDF ---------- */
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,.notice,.editbar,.only-edit,.rowtools,.addbtn,.delbtn,.upbtn{display:none!important}
  #app{padding:0}
  .page{margin:0;box-shadow:none;max-width:none;width:297mm;min-height:210mm;padding:12mm 14mm 16mm;break-after:page;page-break-after:always;overflow:visible}
  .page:last-child{break-after:auto;page-break-after:auto}
  .cover{padding:0}
  .cover .cr{min-height:210mm}
  .pf{left:14mm;right:14mm;bottom:6mm}
  thead{display:table-header-group}
  tr,.kpi,.issue,.photo,.stake{break-inside:avoid}
  .tw{overflow:visible}
  body{font-size:11.5px}
  .page{gap:11px}
  .ph{padding-bottom:8px}
  .ph h2{font-size:22px}
  table{font-size:10.5px}
  tbody td{padding:4px 7px}
  thead th{padding:5px 7px}
  .kpi{padding:8px 11px 9px}
  .kpi .v{font-size:21px}
  .card{padding:10px 13px}
  .dl{font-size:11.5px;gap:4px 12px}
  ul.clean li{margin:1px 0}
  table{font-size:10px}
  tbody td{padding:3px 6px}
  .page{padding:10mm 13mm 15mm}
  .page.cover{padding:0}
  .page{min-height:208mm;gap:9px}
  table.tight{font-size:9.3px}
  table.tight td{padding:2px 5px}
  table.tight .tag{font-size:7.5px;padding:0 4px;line-height:1.35}
  table.tight .pill{font-size:8.5px;padding:1px 6px}
  table.tight td[style*="min-width"]{min-width:0!important}
}

/* ================= interactive layer ================= */
.topbar{position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .toolbar{position:static;box-shadow:none}
.filterbar{background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px}
.seg{display:inline-flex;border:1px solid var(--teal);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--teal-dd);padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.03em}
.seg button+button{border-left:1px solid var(--teal-l)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.fsearch{position:relative;flex:1 1 220px;max-width:360px;min-width:0}
.fsearch input{width:100%;padding:7px 30px 7px 30px;border:1px solid var(--grey-l);border-radius:4px;font-size:12.5px;background:var(--teal-xl)}
.fsearch input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-l)}
.fsearch .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--grey);font-size:13px;pointer-events:none}
.fsearch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:600 10px var(--body);color:var(--grey);border:1px solid var(--grey-l);border-radius:3px;padding:0 5px;background:#fff}
.fb-btn{border:1px solid var(--grey-l);background:#fff;color:var(--ink);padding:6px 10px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.fb-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal-dd)}
.fb-btn:disabled{opacity:.4;cursor:default}
.fb-sel{border:1px solid var(--grey-l);background:#fff;padding:6px 8px;border-radius:4px;font-size:12px;max-width:220px}
.fb-count{font-size:11.5px;color:var(--grey);margin-left:auto;white-space:nowrap}
.fb-count b{color:var(--teal-dd)}
mark{background:#FBE9A8;color:inherit;padding:0 1px;border-radius:2px}

/* clickable things */
.kpi[data-drill],.clickrow,[data-bldg],[data-cat-go],.photo img,[data-rec].issue{cursor:pointer}
.kpi[data-drill]{transition:box-shadow .15s,transform .15s;position:relative}
.kpi[data-drill]:hover{box-shadow:0 4px 14px rgba(45,45,45,.16);transform:translateY(-1px)}
.kpi[data-drill]::after{content:"View details ›";position:absolute;right:10px;top:8px;font-size:9.5px;font-weight:700;color:var(--teal);letter-spacing:.04em;opacity:0;transition:opacity .15s;background:var(--paper);padding-left:4px}
.kpi[data-drill]:hover::after,.kpi[data-drill]:focus-visible::after{opacity:1}
tbody tr.clickrow:hover td,tbody tr[data-bldg]:hover td,tbody tr[data-cat-go]:hover td{background:var(--teal-l)!important}
.issue[data-rec]:hover{box-shadow:0 4px 14px rgba(45,45,45,.14)}
svg [data-bldg]:hover,svg [data-rec]:hover,svg [data-heat]:hover{opacity:.8;cursor:pointer}
th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
th[data-sort]:hover{background:var(--teal-d)}
th[data-sort] .sa{opacity:.45;font-size:9px;margin-left:3px}
th[data-sort].sorted .sa{opacity:1}
.chips2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips2 .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--grey-d)}
.chip b{font-variant-numeric:tabular-nums;color:var(--teal-dd);margin-left:3px}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--teal-dd);border-color:var(--teal-dd);color:#fff}
.chip[aria-pressed="true"] b{color:#EDE9E0}
.flash td,.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#FBE9A8}100%{background:transparent}}
.ph-tools{display:flex;gap:6px;align-items:center;margin-left:10px}
.cra td{vertical-align:top}
.pdash{--pdk-bg:#fff}
.pd-ph{align-items:flex-start}
.pd-health{border:1px solid var(--line);border-left:4px solid var(--rag);padding:8px 12px;min-width:170px;background:#fff}
.pd-health span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey,#666)}
.pd-health b{display:block;font-size:15px;margin-top:2px}.pd-health small{display:block;font-size:11px;color:var(--grey,#666);margin-top:2px;max-width:220px}
.pd-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.pdk{background:var(--pdk-bg);border:1px solid var(--line);border-top:3px solid #3A3A3A;padding:10px 12px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.pdk.hot{border-top-color:#9B2C2C}.pdk.warn{border-top-color:#C0602B}
.pdk-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey,#666)}
.pdk b{font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}.pdk b em{font-style:normal;font-size:14px;color:var(--grey,#777);font-weight:500}
.pdk small{font-size:11px;color:var(--grey,#666)}
.pdk-bar{position:relative;height:6px;background:#ECEEEE;margin-top:4px}.pdk-bar i{position:absolute;left:0;top:0;bottom:0}.pdk-bar .pl{background:#D3CFC6}.pdk-bar .ac{background:#3A3A3A;top:1px;bottom:1px}
.pd-grid{display:grid;gap:12px;margin-bottom:12px}.pd-grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.pd-grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pd-card{background:#fff;border:1px solid var(--line);padding:12px 14px;min-width:0}
.pd-card h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.wsb{margin-bottom:9px}.wsb-h{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}.wsb-h b{font-variant-numeric:tabular-nums}.wsb-h .ed{width:70px}
.wsb-t{height:8px;background:#ECEEEE;margin-top:4px}.wsb-t i{display:block;height:100%}
.wsb small{font-size:10.5px;color:var(--grey,#777)}
.pd-bl{display:flex;flex-direction:column;gap:7px}

.pdb-c{font-weight:700}.pdb-v{text-align:right;font-variant-numeric:tabular-nums}
.pdb-t{position:relative;height:12px;background:#F1F2F2}.pdb-t i{position:absolute;left:0;top:0;bottom:0}.pdb-t .pl{background:#D5DADA}.pdb-t .ac{top:3px;bottom:3px}
.pd-leg{display:flex;gap:14px;font-size:10.5px;color:var(--grey,#666);margin-top:8px}.pd-leg i{display:inline-block;width:12px;height:6px;margin-right:4px;vertical-align:middle}.pd-leg .pl{background:#D5DADA}.pd-leg .ac{background:#3A3A3A}
.pd-dec{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-bottom:8px}

.pd-rk{display:flex;gap:9px;align-items:flex-start;font-size:12px;margin-bottom:8px;cursor:pointer}

.pd-cn{font-size:12px;margin-bottom:6px;line-height:1.45}
.pd-rings{display:flex;gap:16px}.pd-rings>div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--grey,#666)}
.pd-pts{margin:8px 0 0;padding-left:18px;font-size:12px;line-height:1.5}
.pd-com{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.pd-com>div{border-left:2px solid var(--line);padding-left:8px}.pd-com span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey,#666)}.pd-com b{font-size:16px;font-variant-numeric:tabular-nums}
table.cmp td.tot,table.cmp th:last-child{background:#F4F5F3;font-weight:700}
@media (max-width:900px){.pd-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.pd-grid.g2,.pd-grid.g3{grid-template-columns:1fr}.pd-com{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.note{font-size:8px!important;line-height:1.3!important;margin-top:4px!important}.wsb small,.pd-leg,.pd-com+small{display:none}.pdash .pd-card{padding:7px 10px}.pd-card h3{margin-bottom:5px;font-size:9.5px}.pd-kpis{gap:6px;margin:0 0 7px}.pdk{padding:5px 8px}.pdk b{font-size:15px}.pdk small,.pdk-k{font-size:8.5px}.wsb{margin-bottom:2px}.wsb-h{font-size:10px}.wsb-t{height:6px}.wsb small{font-size:9px}.pd-grid{gap:7px;margin-bottom:7px}.pd-dec,.pd-rk,.pd-cn,.pd-pts{font-size:9.5px;margin-bottom:3px;line-height:1.35}.pd-rk small{font-size:8.5px}.pd-rings svg{width:54px;height:54px}.pdb{font-size:10px}.pdb-t{height:9px}.pd-bl{gap:4px}.pd-com b{font-size:13px}.pd-health{padding:5px 9px}.pd-health b{font-size:12.5px}.pd-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.pd-grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.pd-grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.pdash .pd-card,.pdk{break-inside:avoid}}
.pgbtn{border:1px solid var(--line);background:#fff;color:var(--ink,#1f2a2a);border-radius:3px;height:28px;padding:0 10px;font:600 11px/1 inherit;letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.pgbtn:hover{border-color:var(--teal,#2f6f6a)}
.pgbtn.del{color:#9b2c2c}.pgbtn.del:hover{border-color:#9b2c2c;background:#fbf1f1}
.dash .pgbtn{background:transparent}
.cp-body{display:flex;flex-direction:column;gap:14px}
.cp-grid{display:grid;grid-template-columns:1fr 2fr 2fr;gap:10px;margin-top:8px}
.cp-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--grey,#666)}
.cp-grid .ed{width:100%}
.cp-block h3{margin:0 0 8px}
.cp-h .ed{width:100%;font-weight:600}
.cp-text{line-height:1.6;white-space:normal}
.cp-text textarea.ed,.cp-block td textarea.ed{width:100%}
@media (max-width:700px){.cp-grid{grid-template-columns:1fr}.pgbtn{padding:0 6px}}
@media print{.pgbtn{display:none!important}}
.colbtn{border:1px solid var(--line);background:#fff;color:var(--teal-dd);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:13px;line-height:1}
.colbtn:hover{border-color:var(--teal)}
.page.collapsed{min-height:0}
.page.collapsed > :not(.ph):not(.pf){display:none!important}
.page.collapsed .pf{position:static;margin-top:4px}
.filternote{background:var(--a-l);border-left:3px solid var(--a);padding:6px 10px;font-size:11.5px;color:var(--grey-d)}
.empty-filter{border:1px dashed var(--grey-l);padding:12px;text-align:center;color:var(--grey);font-size:12px}

/* tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--teal-dd);color:#fff;font-size:11.5px;line-height:1.35;padding:6px 9px;border-radius:4px;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:opacity .1s}
#tip.on{opacity:1}

/* modal */
#modal{position:fixed;inset:0;z-index:150;background:rgba(20,40,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
#modal[hidden]{display:none}
.mbox{background:#fff;width:100%;max-width:860px;border-top:4px solid var(--teal);box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:none}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.mhead h3{margin:2px 0 0;font:400 21px/1.2 var(--title);color:var(--teal-dd)}
.mhead .x{border:0;background:var(--teal-xl);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--teal-dd);flex:none}
.mbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 20px;border-top:1px solid var(--line);background:var(--teal-xl);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--grey);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.mrow:hover{background:var(--teal-xl)}
.mrow .t{min-width:0}
.mrow .t small{display:block;color:var(--grey)}
.hbar{height:8px;background:#F1EEE7;border-radius:4px;overflow:hidden;min-width:80px}
.hbar i{display:block;height:100%}
.heat{display:grid;grid-template-columns:24px repeat(5,minmax(0,1fr));gap:3px;font-size:11px;max-width:360px}
.heat div{aspect-ratio:1.5/1;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:3px}
.heat .ax{background:none!important;color:var(--grey);font-weight:600;aspect-ratio:auto}
.heat [data-heat]{cursor:pointer}
.heat [data-heat]:hover{outline:2px solid var(--teal-dd)}
.lightbox img{width:100%;max-height:70vh;object-fit:contain;background:#111}
#totop{position:fixed;right:18px;bottom:18px;z-index:40;width:40px;height:40px;border-radius:50%;border:0;background:var(--teal-dd);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#totop.on{opacity:1;pointer-events:auto}
.shortcuts{font-size:11px;color:var(--grey)}
.shortcuts kbd{font:600 10px var(--body);border:1px solid var(--grey-l);border-radius:3px;padding:0 4px;background:#fff;color:var(--ink)}
@media screen and (max-width:700px){
  .topbar{position:static}
  .fb-count{margin-left:0}
  .kv{grid-template-columns:1fr}
  .mbox{max-width:100%}
}
@media print{
  .topbar,#modal,#tip,#totop,.ph-tools,.chips2,.noprint,.filternote,.kpi[data-drill]::after{display:none!important}
  .attn{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr)!important;gap:8px!important}
  .attn .card{padding:7px 10px!important}
  .attn h3{margin-bottom:3px!important}
  .attn .mrow{padding:1px 0;font-size:9.5px;line-height:1.2}
  .attn .mrow small{font-size:8.5px}
  .heat{max-width:220px;font-size:9px;gap:2px;grid-template-columns:16px repeat(5,minmax(0,1fr))}
  .heat div{aspect-ratio:auto;height:15px}
  .heat-note{display:none}
}

/* ================= executive dashboard ================= */
.dash{background:radial-gradient(120% 90% at 100% 0%,#2F5B5E 0%,#2D2D2D 45%,#162E30 100%);color:#fff;gap:14px}
.dash .dash-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dash>*:not(.dash-art):not(.pf){position:relative}
.dash .ph{border-bottom-color:rgba(255,255,255,.14)}
.dash .eyebrow{color:#D9D6CF}
.dash .ph h2{color:#fff;font-size:30px}
.dash .ph .sub{color:rgba(255,255,255,.62)}
.dash .pf{border-top-color:rgba(255,255,255,.14);color:rgba(255,255,255,.55)}
.dash .pf .wm{color:#D9D6CF}
.dash .colbtn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.dash-status{border:1px solid rgba(255,255,255,.18);padding:8px 14px;text-align:right;background:rgba(255,255,255,.04)}
.dash-status span,.dash-status small{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.dash-status small{letter-spacing:.04em;text-transform:none;font-size:10.5px}
.dash-status b{display:flex;gap:7px;align-items:center;justify-content:flex-end;font-size:17px;color:var(--rag)}
.dash-status b i,.tc-rag i{width:9px;height:9px;border-radius:50%;background:var(--rag);box-shadow:0 0 0 4px color-mix(in srgb,var(--rag) 25%,transparent),0 0 14px var(--rag)}
.dash-a{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.35fr);gap:14px}
.hero,.dt,.tc,.dpanel{border:1px solid rgba(255,255,255,.13);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border-radius:6px;min-width:0}
.hero{padding:12px 16px}
.hero-k,.dt-top,.dp-k{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.dp-k{margin-bottom:6px}
.hero-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero-in svg{flex:none;max-width:100%}
.hero-leg{flex:1 1 150px;display:flex;flex-direction:column;gap:7px;font-size:11.5px;min-width:0}
.hero-leg>div{display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:6px}
.hero-leg i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 10px var(--c)}
.hero-leg span{flex:1;color:rgba(255,255,255,.72)}
.hero-leg b{font-variant-numeric:tabular-nums;font-size:14px}
.hero-leg .hero-x{border-bottom:0;padding:0 0 0 18px}
.hero-leg .hero-x b{font-size:12.5px}
.dt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dt{padding:10px 12px;display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--acc)}
.dt-mid{display:flex;align-items:center;gap:10px;min-height:58px}
.dt-v{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt-v .of{font-size:14px;color:rgba(255,255,255,.55);font-weight:600}
.dt-v small{display:block;font-size:11px;color:var(--acc);font-weight:700;margin-top:3px}
.dt-n{font-size:10.5px;color:rgba(255,255,255,.62)}
.dt-go{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:inline-flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0;color:#fff;transition:background .15s,transform .15s}
.dots{display:flex;flex-wrap:wrap;gap:4px;width:58px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.psbar{width:58px;display:flex;flex-direction:column;gap:4px}
.psbar i{display:block;height:8px;border-radius:4px}
.dash-b{display:grid;gap:12px}
.tc{position:relative;overflow:hidden;padding:11px 14px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--rag)}
.tc-wm{position:absolute;right:-6px;bottom:-26px;font:400 104px/1 var(--title);color:rgba(255,255,255,.05);pointer-events:none;letter-spacing:-.02em}
.tc-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tc-code{font:400 22px/1 var(--title);letter-spacing:.06em}
.tc-name{font-size:11px;color:rgba(255,255,255,.62);margin-top:2px}
.tc-rag{display:flex;gap:7px;align-items:center;font-size:10.5px;font-weight:700;color:var(--rag);white-space:nowrap}
.tc-body{display:flex;gap:12px;align-items:center}
.tc-body svg{flex:none}
.tc-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:11px;flex:1;min-width:0}
.tc-kv dt{color:rgba(255,255,255,.55)}
.tc-kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tc-foot{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.08);padding-top:5px}
.tc-link{color:#D9D6CF;text-decoration:none;font-weight:700}
.tc-link:hover{text-decoration:underline}
.tc.empty-t{border-left-style:dashed}
.tc.empty-t .tc-body{opacity:.55}
.dash-c{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.dpanel{padding:10px 14px}
.wl-i{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;cursor:pointer}
.wl-i:last-child{border-bottom:0}
.wl-i i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:4px;flex:none;box-shadow:0 0 8px var(--c)}
.wl-i span{min-width:0}
.wl-i b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-i small{color:rgba(255,255,255,.55)}
.wl-i:hover b{color:#D9D6CF}
.dash [data-drill]{cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s}
.dash .hero[data-drill]:hover,.dash .dt[data-drill]:hover,.dash .tc[data-drill]:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.dash [data-drill]:hover .dt-go{background:#fff;color:#2D2D2D;transform:rotate(45deg)}
.dash [data-drill]:focus-visible{outline:2px solid #D9D6CF}
.arcv{animation:arcin 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes arcin{from{stroke-dasharray:0 var(--c)}}
@media (prefers-reduced-motion:reduce){.arcv{animation:none}}

/* always-visible “details” affordance on every clickable KPI card */
.kpi[data-drill] .k{padding-right:20px}
.kpi[data-drill]::after{content:"↗"!important;position:absolute;right:9px;top:9px;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;opacity:1!important;background:var(--paper);color:var(--teal-d);padding:0!important;transition:background .15s,color .15s,transform .15s}
.kpi[data-drill]:hover::after{background:var(--teal-dd);color:#fff;border-color:var(--teal-dd);transform:rotate(45deg)}

/* live pulse bar */
#pulse{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;padding:7px 16px;background:#2D2D2D;color:#fff;font-size:11.5px;border-top:1px solid rgba(255,255,255,.1)}
#pulse[hidden]{display:none}
#pulse .pl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#D9D6CF;font-weight:700;display:flex;align-items:center;gap:6px}
#pulse .pl::before{content:"";width:7px;height:7px;border-radius:50%;background:#6FD0BF;box-shadow:0 0 8px #6FD0BF;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
#pulse .pi{display:flex;gap:5px;align-items:baseline;padding:1px 6px;border-radius:3px}
#pulse .pi small{color:rgba(255,255,255,.55);font-size:10.5px}
#pulse .pi b{font-variant-numeric:tabular-nums}
#pulse .pi.chg{animation:pchg 1.4s ease}
@keyframes pchg{0%,35%{background:#E2B865;color:#2D2D2D}100%{background:transparent}}
#pulse .pgo{margin-left:auto;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:3px;padding:3px 9px;cursor:pointer;font-size:11px;font-weight:600}

/* cover art */
.cover .cr .cover-art{position:absolute;inset:0;width:100%;height:100%}

@media screen and (max-width:900px){
  .dash-a,.dash-c{grid-template-columns:1fr}
  .dash-b{grid-template-columns:1fr!important}
  .dt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media screen and (max-width:520px){
  .dt-grid{grid-template-columns:1fr}
  .hero-in{justify-content:center}
  .dash .ph{flex-direction:column}
}
@media print{
  #pulse,.dt-go{display:none!important}
  .kpi[data-drill]::after{display:none!important}
  .kpi[data-drill] .k{padding-right:0}
  .arcv{animation:none}
  .dash .dash-status{padding:6px 12px}
  .dash{gap:13px;padding-top:28px}
  .dash .ph{padding-bottom:8px}
  .dash .ph h2{font-size:26px}
  .hero{padding:9px 14px}
  .hero-in svg{width:194px;height:194px}
  .hero-leg{gap:5px}
  .dt-grid{gap:8px}
  .dt{padding:8px 11px;gap:2px}
  .dt-mid{min-height:46px}
  .dt-mid svg{width:48px;height:48px}
  .dt-v{font-size:21px}
  .tc{padding:9px 13px;gap:4px}
  .tc-body svg{width:84px;height:84px}
  .tc-foot{display:none}
  .dpanel{padding:8px 13px}
  .wl-i{padding:3px 0}
}

/* ================= action log ================= */
.abadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap;letter-spacing:.02em}
.abadge.none{background:var(--a-l);color:var(--a);border:1px dashed var(--a)}
.abadge.b{background:var(--b-l);color:var(--b)}
.abadge.g{background:var(--g-l);color:var(--g)}
.abadge.r{background:var(--r-l);color:var(--r)}
.pill.b{background:var(--b-l);color:var(--b)}
.flagged{padding-bottom:8px}
.fgrp{border-top:1px solid var(--line)}
.fgrp:first-of-type{border-top:0}
.fgrp summary{display:flex;gap:8px;align-items:center;padding:7px 0;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--teal-dd);list-style:none}
.fgrp summary::-webkit-details-marker{display:none}
.fgrp summary::before{content:"▸";font-size:10px;color:var(--teal);transition:transform .15s}
.fgrp[open] summary::before{transform:rotate(90deg)}
.fgrp summary b{background:var(--teal-dd);color:#fff;border-radius:9px;padding:0 7px;font-size:10px}
.fgrp summary .fg-cov{margin-left:auto;font-weight:600;color:var(--grey);font-size:10.5px}
.fitem{display:flex;gap:8px;align-items:center;padding:5px 0 5px 16px;border-top:1px dashed var(--line)}
.fitem .t{flex:1;min-width:0;cursor:pointer}
.fitem .t b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .t small{display:block;color:var(--grey);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .t:hover b{color:var(--teal-d);text-decoration:underline}
.fb-btn.sm{padding:3px 8px;font-size:11px}
.fb-btn.solid{background:var(--teal-dd);border-color:var(--teal-dd);color:#fff}
.fb-btn.solid:hover{background:var(--teal-d);color:#fff}
.actrow{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;min-width:0;flex:1}
.actrow:last-child{border-bottom:0}
.actrow .adot{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:4px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.actrow .t{flex:1;min-width:0}
.actrow .t small{display:block;color:var(--grey);font-size:10.5px;margin-top:1px}
.actrow .aitem{color:var(--teal-d);font-weight:600;cursor:pointer}
.actrow .aitem:hover{text-decoration:underline}
.actrow.edit{align-items:center}
.feed{cursor:pointer;border-radius:3px}
.feed:hover{background:var(--teal-xl)}
.mrow .actrow{border-bottom:0;padding:0}
.actbox{border:1px solid var(--line);border-left:3px solid var(--teal);background:var(--teal-xl);padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.actbox-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.actform{display:grid;grid-template-columns:160px minmax(0,1fr) auto 130px auto;gap:6px;align-items:center;margin-top:6px;padding-top:8px;border-top:1px dashed var(--grey-l)}
.actform input,.actform select{border:1px solid var(--grey-l);background:#fff;padding:6px 8px;border-radius:3px;font-size:12px;min-width:0;width:100%}
.actform input:focus,.actform select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
.actform input.need{border-color:var(--r);box-shadow:0 0 0 3px var(--r-l)}
.actform .dlab{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--grey)}
.actform .dlab input{width:140px}
.actform input[name="action"]{grid-column:1/-1;padding:8px 10px;font-size:12.5px}
.wl-i .abadge{margin-left:auto;align-self:center;flex:none}
.dash .abadge.none{background:rgba(226,184,101,.12);color:#E2B865;border-color:rgba(226,184,101,.6)}
.dash .abadge.b{background:rgba(159,211,203,.15);color:#D9D6CF}
.dash .abadge.g{background:rgba(124,197,150,.18);color:#7CC596}
.dash .abadge.r{background:rgba(233,139,118,.18);color:#E98B76}
@media screen and (max-width:900px){ .actform{grid-template-columns:1fr 1fr} .actform input[name="action"]{grid-column:1/-1} }
@media screen and (max-width:520px){ .actform{grid-template-columns:1fr} .actform .dlab input{width:100%} .fitem{flex-wrap:wrap} }
@media print{ .actform,.fb-btn{display:none!important} .fgrp summary::before{display:none} .fitem{padding:3px 0 3px 8px} }
@media print{
  .actgrid{grid-template-columns:1fr!important;gap:8px!important}
  .flagged{columns:3;column-gap:16px;padding:8px 12px}
  .flagged h3{column-span:all}
  .fgrp{break-inside:avoid;border-top:0;margin-bottom:6px}
  .fgrp summary{padding:3px 0;font-size:10px}
  .fgrp summary .fg-cov{font-size:9px}
  .fitem{gap:5px;padding:2px 0 2px 4px}
  .fitem .t b{font-size:9.5px}
  .fitem .t small{font-size:8.5px}
  .abadge{font-size:8px;padding:1px 5px}
  .actrow{padding:3px 0;font-size:10px}
}

/* ================= template editing ================= */
.ed{color:var(--ink)!important;background:#FFFDF6!important;-webkit-text-fill-color:var(--ink)}
.ed::placeholder{color:#9AA5A5;-webkit-text-fill-color:#9AA5A5}
.cover .ed{font-family:var(--body)}
.cover h1 .ed{font:400 26px/1.2 var(--title)}
.editing .lbl-ed{cursor:pointer;border-radius:2px;box-shadow:0 0 0 1px rgba(101,150,153,.28);transition:background .12s,box-shadow .12s}
.editing .lbl-ed:hover,.editing .lbl-ed:focus-visible{background:rgba(255,236,170,.55)!important;box-shadow:0 0 0 2px #E2B865;color:var(--ink)!important;outline:none}
.editing .dash .lbl-ed{box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.editing .dash .lbl-ed:hover{background:rgba(226,184,101,.35)!important;color:#fff!important}
.editing th .lbl-ed,.editing th.lbl-ed{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.editing th .lbl-ed:hover,.editing th.lbl-ed:hover{color:#fff!important;background:rgba(226,184,101,.45)!important}
.editing .cover .lbl-ed:hover{color:#fff!important;background:rgba(226,184,101,.35)!important}
.editing .lbl-ovr{background:rgba(226,184,101,.22)}
.editing .lbl-ovr::after{content:" ✎";font-size:.7em;color:#B98A2E;font-weight:700}
.lbl-active{box-shadow:0 0 0 3px #E2B865!important;background:rgba(255,236,170,.6)!important}
#lblpop{position:fixed;z-index:400;background:#fff;color:var(--ink);border:1px solid var(--line);border-top:4px solid #E2B865;box-shadow:0 18px 44px rgba(0,0,0,.28);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font:13px/1.4 var(--body)}
#lblpop[hidden]{display:none}
#lblpop .lp-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-d)}
#lblpop .lp-x{border:0;background:var(--teal-xl);width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--teal-dd)}
#lblpop .lp-note{font-size:11.5px;background:var(--a-l);color:#7A5A1A;padding:6px 8px;border-radius:3px}
#lblpop textarea{width:100%;border:2px solid var(--teal);border-radius:4px;padding:8px 10px;font:15px/1.4 var(--body);color:var(--ink);background:#fff;resize:vertical}
#lblpop textarea:focus{outline:none;box-shadow:0 0 0 3px var(--teal-l)}
#lblpop .lp-def{font-size:11px;color:var(--grey);min-height:14px}
#lblpop .lp-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media print{ .lbl-ovr::after{content:none!important} #lblpop{display:none!important} }
.editing td.lbl-ed,.editing th.lbl-ed{box-shadow:none;outline:1px solid rgba(101,150,153,.35);outline-offset:-3px}
.editing td.lbl-ed:hover,.editing th.lbl-ed:hover{outline:2px solid #E2B865;outline-offset:-3px;box-shadow:none}
.editing th.lbl-ed{outline-color:rgba(255,255,255,.35)}

/* =====================================================================
   minimal high-end layer
   Quiet palette, hairline rules, light numerals, generous space.
   ===================================================================== */
:root{
  --ink:#1E2A2B; --grey-d:#4B5556; --grey:#8A8A8A; --grey-l:#CDD2D1; --line:#E4E7E5; --desk:#EDEEEB; --paper:#FFFFFF;
  --teal:#8F8A80; --teal-d:#4A4A4A; --teal-dd:#2D2D2D; --teal-l:#EFECE5; --teal-xl:#F7F5F0;
  --brass:#B09566; --brass-l:#EFE8DA;
  --g:#4F8662; --a:#B3893A; --r:#AE5440; --b:#4D7596;
  --g-l:#EAF1EC; --a-l:#F6F0E2; --r-l:#F5E8E4; --b-l:#E8EEF3;
}
html,body{background:var(--desk);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:var(--brass-l)}

/* ---------- top bar ---------- */
.topbar{box-shadow:none;border-bottom:1px solid var(--line)}
.topbar .toolbar{background:var(--paper);color:var(--ink);padding:10px 24px;gap:6px 6px;border-bottom:1px solid var(--line)}
.toolbar .brand{font-size:15px;color:var(--teal-dd);letter-spacing:.01em}
.toolbar .brand small{color:var(--grey);opacity:1;font-size:11.5px;letter-spacing:.02em}
.tb{border:1px solid transparent;color:var(--grey-d);background:transparent;border-radius:2px;padding:6px 11px;font-weight:500;font-size:12px;letter-spacing:.01em}
.tb:hover{background:var(--teal-xl);color:var(--teal-dd)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.on{background:var(--teal-dd);color:#fff;border-color:var(--teal-dd)}
.tb.solid{background:var(--teal-dd);border-color:var(--teal-dd);color:#fff}
.tb.solid:hover{background:var(--teal-d);color:#fff}
.filterbar{padding:8px 24px;border-bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px)}
.seg{border-color:var(--line);border-radius:2px}
.seg button{color:var(--grey-d);font-weight:600;font-size:11.5px;letter-spacing:.08em;padding:6px 13px}
.seg button+button{border-left-color:var(--line)}
.seg button[aria-pressed="true"]{background:var(--teal-dd);color:#fff}
.fsearch input{background:var(--paper);border-color:var(--line);border-radius:2px}
.fb-btn,.fb-sel{border-color:var(--line);border-radius:2px;font-weight:500;color:var(--grey-d)}
.fb-btn.solid{background:var(--teal-dd);border-color:var(--teal-dd);color:#fff}
#pulse{background:var(--teal-dd);padding:6px 24px}
#pulse .pl{color:#D9C8A4}
#pulse .pl::before{background:#D9C8A4;box-shadow:none}

/* ---------- page ---------- */
#app{padding:28px 16px 80px}
.page{box-shadow:0 1px 2px rgba(30,42,43,.04),0 12px 32px rgba(30,42,43,.06);margin:24px auto;padding:40px 52px 60px;gap:18px;border-radius:0}
.ph{border-bottom:1px solid var(--line);padding-bottom:16px;align-items:flex-end}
.eyebrow{font-size:9.5px;font-weight:600;letter-spacing:.3em;color:var(--brass);display:flex;align-items:center;gap:10px}
.ph .eyebrow::before{content:"";width:22px;height:1px;background:var(--brass);flex:none}
.ph h2{font-size:28px;letter-spacing:.035em;color:var(--teal-dd);margin-top:8px}
.ph .sub{color:var(--grey);font-size:12px;margin-top:6px;letter-spacing:.01em}
.ph .meta{font-size:10.5px;color:var(--grey);letter-spacing:.02em}
.ph .meta b{font-weight:600;color:var(--teal-dd);letter-spacing:.04em}
.pf{border-top:1px solid var(--line);font-size:9.5px;letter-spacing:.06em;color:var(--grey);left:52px;right:52px;bottom:20px}
.pf .wm{color:var(--teal-dd);letter-spacing:.02em}
.pf .pn{font-variant-numeric:tabular-nums}
.colbtn{border-color:var(--line);color:var(--grey);border-radius:2px;width:26px;height:26px;font-size:11px}
.filternote{background:transparent;border-left:2px solid var(--brass);color:var(--grey-d)}

/* ---------- cards ---------- */
.grid{gap:14px}
.card{border:0;border-top:1px solid var(--ink);padding:14px 0 4px;background:transparent}
.card.tint{background:transparent;border-top-color:var(--line)}
.card h3,.card > h3{font-size:9.5px;letter-spacing:.24em;color:var(--teal-dd);font-weight:700;margin-bottom:12px}

/* ---------- KPI tiles ---------- */
.kpi{border:0;border-top:1px solid var(--line);padding:14px 2px 6px;background:transparent;gap:6px;position:relative}
.kpi::before{content:"";position:absolute;left:0;top:-1px;width:28px;height:2px;background:var(--teal-dd)}
.kpi.g::before{background:var(--g)} .kpi.a::before{background:var(--a)} .kpi.r::before{background:var(--r)} .kpi.b::before{background:var(--b)} .kpi.na::before{background:var(--grey-l)}
.kpi .k{font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--grey)}
.kpi .v{font-size:30px;font-weight:300;letter-spacing:-.01em;color:var(--ink);line-height:1.05}
.kpi.g .v,.kpi.a .v,.kpi.b .v{color:var(--ink)}
.kpi.r .v{color:var(--r)}
.kpi.na .v{color:var(--grey-l)}
.kpi .v small{font-weight:400;font-size:13px}
.kpi .n{font-size:10.5px;color:var(--grey);line-height:1.4}
.bar{height:2px;background:var(--line);border-radius:0;margin-top:4px}
.bar i{background:var(--teal-dd)}
.kpi.g .bar i{background:var(--g)} .kpi.a .bar i{background:var(--a)} .kpi.r .bar i{background:var(--r)} .kpi.b .bar i{background:var(--b)}
.kpi[data-drill]:hover{box-shadow:none;transform:none;background:var(--teal-xl)}
.kpi[data-drill]::after{border-color:var(--line)!important;background:transparent!important;color:var(--grey)!important;top:12px!important;right:4px!important;width:16px!important;height:16px!important;font-size:9px!important}
.kpi[data-drill]:hover::after{background:var(--teal-dd)!important;color:#fff!important;border-color:var(--teal-dd)!important}

/* ---------- tables ---------- */
table{font-size:11.5px}
thead th{background:transparent;color:var(--grey);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 8px 7px;border-bottom:1px solid var(--ink)}
th[data-sort]:hover{background:var(--teal-xl);color:var(--teal-dd)}
th[data-sort] .sa{color:var(--grey-l)}
th[data-sort].sorted{color:var(--teal-dd)}
th[data-sort].sorted .sa{color:var(--brass)}
tbody td{padding:8px;border-bottom:1px solid var(--line)}
td:has(> .rag),td:has(> .pill){white-space:nowrap}
tbody tr:nth-child(even) td{background:transparent}
tr.sub td{background:transparent!important;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:600}
tr.grp td{background:transparent!important;color:var(--brass);font-size:9px;letter-spacing:.24em;padding-top:14px;border-bottom:1px solid var(--line)}
tbody tr.clickrow:hover td,tbody tr[data-bldg]:hover td,tbody tr[data-cat-go]:hover td{background:var(--teal-xl)!important}

/* ---------- status marks ---------- */
.pill{background:transparent!important;border-radius:0;padding:0;font-weight:600;font-size:10.5px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.n{color:var(--grey)}
.tag{border-color:var(--grey-l);color:var(--grey-d);font-size:9px;letter-spacing:.14em;padding:1px 5px;font-weight:600}
.score{background:transparent!important;font-weight:600;padding:0;min-width:0;border-bottom:2px solid currentColor;border-radius:0}
.rag{width:7px;height:7px;vertical-align:1px}
.legend{font-size:10px;color:var(--grey);letter-spacing:.02em}
.legend span::before{width:8px;height:8px;border-radius:50%}
.note{font-style:normal;color:var(--grey);font-size:10px;letter-spacing:.01em}
.empty{border:1px solid var(--line);background:transparent}
mark{background:var(--brass-l)}

/* ---------- other blocks ---------- */
.toc{gap:0 56px}
.toc a{padding:12px 0;font-size:14px;letter-spacing:.01em;border-bottom-color:var(--line)}
.toc a b{color:var(--brass);font-weight:500;font-size:12px;letter-spacing:.1em;width:26px}
.toc a:hover{color:var(--teal-dd)}
.stake{border:0;border-top:1px solid var(--line);border-left:0;padding:14px 0}
.stake .c{font-weight:500;font-size:16px;color:var(--teal-dd)}
.stake .s{border-top:0;padding-top:0;color:var(--grey)}
.issue{border:0;border-top:1px solid var(--ink)!important;padding:14px 0 8px;background:transparent}
.issue h4{font-weight:600;font-size:13.5px}
.issue .act{color:var(--grey-d)}
.issue .by{font-style:normal;letter-spacing:.02em}
.issue[data-rec]:hover{box-shadow:none;background:var(--teal-xl)}
.photo{border:0;background:transparent}
.photo .cap{padding:6px 0;color:var(--grey-d)}
.sig{border:0;border-top:1px solid var(--line);padding:16px 0}
.dl dt,.kv dt{font-size:9px;letter-spacing:.2em;color:var(--grey)}
.dl dd{font-weight:500}
.chip{border-color:var(--line);border-radius:2px;font-weight:500;padding:3px 10px}
.chip[aria-pressed="true"]{background:var(--teal-dd);border-color:var(--teal-dd)}
.chips2 .lbl{color:var(--brass);letter-spacing:.24em;font-size:9px}

/* ---------- cover ---------- */
.page.cover{padding:0;gap:0}
.cover .cl{background:#17302F;padding:56px 48px;gap:20px}
.wordmark{font-size:28px;font-weight:600}
.cover h1{font-size:38px;letter-spacing:.04em;line-height:1.15}
.cover .proj{font-weight:400;font-size:19px;color:#D9C8A4;letter-spacing:.04em}
.cover .period{font-size:12.5px;letter-spacing:.06em;opacity:.75}
.cover .chips span{border-color:rgba(255,255,255,.22);font-weight:500;letter-spacing:.16em;font-size:9.5px;padding:5px 11px}
.cover .foot{opacity:.7;border-top-color:rgba(255,255,255,.14);font-size:10.5px;letter-spacing:.02em}
.cover .cr{background:linear-gradient(170deg,#4E7F82 0%,#3A3A3A 100%)}
.cover .cr .ov{background:linear-gradient(transparent,rgba(16,32,33,.7))}
.cover .cr .ov .eyebrow{color:#D9C8A4!important}

/* ---------- executive dashboard ---------- */
.dash{background:#17302F}
.dash .dash-art{opacity:.55}
.dash .eyebrow{color:#D9C8A4}
.dash .ph .eyebrow::before{background:#D9C8A4}
.dash .ph h2{font-size:32px;letter-spacing:.04em}
.hero,.dt,.tc,.dpanel{background:transparent;border:0;border-top:1px solid rgba(255,255,255,.16);border-radius:0}
.dt{border-top:1px solid rgba(255,255,255,.16)!important;position:relative;padding:12px 2px 6px}
.dt::before{content:"";position:absolute;left:0;top:-1px;width:28px;height:2px;background:var(--acc)}
.hero{padding:12px 0}
.tc{border-left:0!important;padding:12px 0 8px}
.tc::before{content:"";position:absolute;left:0;top:-1px;width:28px;height:2px;background:var(--rag)}
.tc.empty-t{border-top-style:dashed}
.tc-wm{color:rgba(255,255,255,.035)}
.dpanel{padding:12px 0}
.hero-k,.dt-top,.dp-k{letter-spacing:.24em;font-weight:600;color:rgba(255,255,255,.5)}
.dt-v{font-weight:300;font-size:28px;letter-spacing:-.01em}
.dt-v small{font-weight:500;letter-spacing:.02em}
.dt-go{border-color:rgba(255,255,255,.18)}
.hero-leg i,.dots i,.wl-i i,.dash-status b i,.tc-rag i{box-shadow:none!important}
.hero-leg b{font-weight:400}
.hero svg .arcv,.dt svg .arcv,.tc svg .arcv{stroke-linecap:butt}
.dash-status{border:0;border-left:1px solid rgba(255,255,255,.16);background:transparent;padding:4px 0 4px 16px}
.dash-status b{font-weight:400;font-size:18px}
.dash .hero[data-drill]:hover,.dash .dt[data-drill]:hover,.dash .tc[data-drill]:hover{transform:none;box-shadow:none;background:rgba(255,255,255,.035)}
.dash .abadge{border-radius:0}
.tc-code{letter-spacing:.1em}
.wl-i{border-bottom-color:rgba(255,255,255,.08)}

/* ---------- modal & editor ---------- */
#modal{background:rgba(17,30,31,.5);backdrop-filter:blur(2px)}
.mbox{border-top:2px solid var(--brass);box-shadow:0 30px 70px rgba(0,0,0,.25)}
.mhead h3{font-size:22px;letter-spacing:.03em}
.mhead .x{background:transparent;border:1px solid var(--line)}
.mfoot{background:var(--paper)}
.actbox{border:0;border-top:1px solid var(--ink);background:transparent;padding:12px 0}
#lblpop{border-radius:2px;border-top:2px solid var(--brass)}
.abadge{border-radius:0;font-weight:600;letter-spacing:.02em}
.fitem{border-top-color:var(--line);border-top-style:solid}
.fgrp summary b{background:transparent;color:var(--brass);padding:0}
#totop{background:var(--teal-dd);width:36px;height:36px;font-size:15px}
#toast{border-radius:2px!important}

@media screen and (max-width:900px){ .page{padding:28px 20px 56px} .pf{left:20px;right:20px} .topbar .toolbar,.filterbar{padding-left:16px;padding-right:16px} }
@media print{

/* =====================================================================
   MINIMAL
   White space, one ink colour, one brand accent, colour only for status.
   No decoration: no art, no glows, no boxes, no badges.
   ===================================================================== */
:root{
  --ink:#1E1E1E; --grey-d:#4A5050; --grey:#8A8A8A; --grey-l:#D5D8D7; --line:#ECEDEC; --desk:#F7F7F5; --paper:#FFFFFF;
  --teal-dd:#2D2D2D; --teal-d:#2D2D2D; --teal:#2D2D2D; --teal-l:#F3F1EC; --teal-xl:#F7F5F0;
  --brass:#8A8A8A; --brass-l:#F1F2F1;
  --g:#3F7656; --a:#9A7B3F; --r:#A84E3B; --b:#4A5050;

  if(type==='risks'){ const f=find('risks',r=>String(r.id)===id); return f&&{label:`Risk ${f.x.id} — ${f.x.desc}`,sub:`Score ${riskShown(f.x)} · owner ${f.x.owner||'—'}`,cat:f.x.cat,open:`data-rec="risks" data-i="${f.i}"`}; }
  if(type==='issues'){ const f=find('issues',x=>x.title===id); return f&&{label:f.x.title,sub:f.x.action||f.x.desc||'',cat:f.x.cat,open:`data-rec="issues" data-i="${f.i}"`}; }

/* ============================== EDIT ANY TEXT / NUMBER ==============================
   Template mode: in ✎ Edit every piece of text on every page — titles, headings, labels,
   notes, column headers, contents entries and calculated numbers — can be clicked and
   changed in a clear editor box. Custom text is stored in D.labels and saved with the

const LBL_SEL = [
  ['eyebrow','.ph .eyebrow','l'], ['title','.ph h2','l'], ['sub','.ph .sub','l'],
  ['kpi-v','.kpi .v','v','.k'], ['kpi-n','.kpi .n','v','.k'],
  ['dt-v','.dt-v','v','.dt-k'], ['dt-n','.dt-n','v','.dt-k'], ['hero-v','.hero-leg > div > b','v','span'],
  ['tc-v','.tc-kv dd','v','dt'], ['kv-v','dl dd','v','dt'], ['status-v','.dash-status > b','v','span'],
  ['td','td','v','row']
];
const ownText = el => { const sa=el.querySelector(':scope > .sa'); return (sa ? [...el.childNodes].filter(n=>n!==sa).map(n=>n.textContent).join('') : el.textContent).replace(/\s+/g,' ').trim(); };
function setOwnText(el,t){
  const sa=el.querySelector(':scope > .sa');

function anchorFor(el,mode,sib){

const LBL_SKIP = 'svg,button,select,option,input,textarea,kbd,script,style,.ph-tools,.chips2,.rowtools,.actform,.actbox,.only-edit,.sa,[data-p],.toc a > b,.notice,.editbar';
function lblEligible(el,name){
  if(el.closest(LBL_SKIP)) return false;
  if(el.querySelector('input,textarea,select,button,img,svg,[data-p]')) return false;
  if(name==='td'){
    if(el.closest('thead')) return false;
    if([...el.querySelectorAll('*')].some(c=>!/^(B|SMALL|SPAN|MARK|BR)$/.test(c.tagName) || /\b(pill|tag|rag|score)\b/.test(c.className))) return false;
  }

function markLbl(el,key,mode){
  const L=D.labels; el.dataset.lbl=key; el.dataset.def=ownText(el); el.dataset.mode=mode;

function applyLabels(){
  if(!D.labels || typeof D.labels!=='object' || Array.isArray(D.labels)) D.labels={};
  document.querySelectorAll('#app .page').forEach(pg=>{
    const seen={}; const K=(name,anc)=>{ const base=`${pg.id}|${name}|${anc}`; const n=seen[base]=(seen[base]||0)+1; return `${base}|${n}`; };
    /* 1 · numbers & values, keyed by their label so they survive data changes */
    LBL_SEL.forEach(([name,sel,mode,sib])=>{
      pg.querySelectorAll(sel).forEach(el=>{ if(el.dataset.lbl || el.closest('[data-lbl]') || !lblEligible(el,name)) return; markLbl(el,K(name,anchorFor(el,mode,sib)),mode); });
    });
    /* 2 · contents entries → they rename the section everywhere */
    pg.querySelectorAll('.toc a[data-jump]').forEach(a=>{ const tn=[...a.childNodes].find(n=>n.nodeType===3&&n.textContent.trim()); if(!tn) return; const sp=document.createElement('span'); a.replaceChild(sp,tn); sp.textContent=tn.textContent; markLbl(sp,`toc|entry|${a.dataset.jump}`,'l'); });
    /* 3 · every other piece of visible text on the page */
    const walker=document.createTreeWalker(pg,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ if(!n.textContent.trim()) return NodeFilter.FILTER_REJECT; const p=n.parentElement; if(!p || p.closest(LBL_SKIP) || p.closest('[data-lbl]') || p.closest('.pf')) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_ACCEPT; }});
    const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
    nodes.forEach(tn=>{
      const p=tn.parentElement; let el=p;
      const leaf = [...p.childNodes].every(c=>c===tn || (c.nodeType===3 && !c.textContent.trim()));
      if(!leaf || p.tagName==='A' || p.closest('[data-jump],[data-bldg],[data-rec]')===p && p.children.length){ el=document.createElement('span'); el.className='tn'; p.replaceChild(el,tn); el.appendChild(tn); }
      if(el.closest('[data-lbl]')) return;
      const host = el.classList.contains('tn') ? p : el;
      const tag=host.tagName.toLowerCase()+(host.classList[0]&&!/^(tn|lbl-|sorted)/.test(host.classList[0])?'.'+host.classList[0]:'');
      markLbl(el,K('t:'+tag,ownText(el).slice(0,80)),'l');
    });
  });
}

function ganttChart(b){

  let mk=null; if(b.marker){ const d=new Date(b.marker); if(!isNaN(d)){ const t=(d.getFullYear()-y0)*12+d.getMonth()-(m0-1)+(d.getDate()-1)/30; if(t>=0&&t<=n) mk=t; } }

  return `<div class="gantt"><div class="gr gh"><div class="gc gsr">Sr</div><div class="gc gact">Activity</div><div class="gc gdur">Duration</div><div class="gc gres">Responsibility</div><div class="gc gbar gscale"><div class="gyr">${yrs.map(x=>`<span style="flex:${x.n}">${x.y}</span>`).join('')}</div><div class="gmo">${ms.map(x=>`<span>${x.m}</span>`).join('')}</div></div></div>${rows}</div>

const UNDO=[], REDO=[]; let lastSnap=0;
function snapshot(force){ const now=Date.now(); if(!force && now-lastSnap<1500){ lastSnap=now; return; } lastSnap=now; UNDO.push(JSON.stringify(D)); if(UNDO.length>60) UNDO.shift(); REDO.length=0; }

function redo(){ if(!REDO.length) return; UNDO.push(JSON.stringify(D)); D=JSON.parse(REDO.pop()); lastSnap=0; autosave(); render(); toast('Redone'); }

function readImage(file, maxW){
  return new Promise((res,rej)=>{ const rd=new FileReader(); rd.onerror=rej; rd.onload=()=>{ const img=new Image(); img.onload=()=>{
    const sc=Math.min(1,maxW/img.width), c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL(file.type==='image/png'&&maxW<=600?'image/png':'image/jpeg',0.82)); }; img.onerror=rej; img.src=rd.result; }; rd.readAsDataURL(file); });
}

      <label class="lg-file"><input type="file" id="lgImport" accept=".html,.json,text/html,application/json"> Choose report file…</label>
      ${Object.keys(LIVE.reports).length?`<p class="small muted">Or open a saved month: ${Object.keys(LIVE.reports).sort().reverse().map(r=>`<a href="?r=${encodeURIComponent(r)}">${esc(r)}</a>`).join(' · ')}</p>`:''}`
    :`${c.apiUrl?'':`<label>Server address (web app URL)<input id="lgApi" type="url" value="${esc(LIVE.api)}" placeholder="https://script.google.com/macros/s/…/exec"></label>`}
      <label>Team passcode<input id="lgKey" type="password" value="${esc(LIVE.key)}" autocomplete="current-password"></label>
      <label>Your name<input id="lgUser" type="text" value="${esc(LIVE.user)}" placeholder="Shown in the Change Log"></label>
      <div class="lg-f"><span class="small muted">Ask Grace for the team passcode.</span><button class="tb solid" id="lgGo">Open report</button></div>`}
  </div>`;
  g.hidden=false; document.body.classList.add('lv-gated');
  const k=g.querySelector('#lgKey'); if(k) setTimeout(()=>(LIVE.key?g.querySelector('#lgGo'):k).focus(),50);
}
function liveUngate(){ const g=document.getElementById('liveGate'); if(g) g.hidden=true; document.body.classList.remove('lv-gated'); }
async function liveConnect(){
  if(!LIVE.api||!LIVE.key||!LIVE.user) return liveGate('',{});
  liveBusy(true,'Connecting…');
  try{ const j=await liveCall('ping'); LIVE.links={folder:j.folder,sheet:j.sheet}; LIVE.reports=j.reports||{};
    if(!LIVE.report){ const r=Object.keys(LIVE.reports).sort().reverse()[0]; LIVE.report=r||(window.KETURAH_LIVE.reportId||''); }
    await liveLoad();
  }catch(e){ liveBusy(false); liveGate(e.code==='auth'?'That passcode was not accepted.':e.code==='not-setup'?'The server is not set up yet — run setup() in Apps Script.':'Could not reach the server: '+e.message,{err:true}); }
}
async function liveLoad(quiet){
  if(!quiet) liveBusy(true,'Loading '+LIVE.report+'…');
  try{ const j=await liveCall('load'); liveBusy(false);
    if(!j.data){ LIVE.meta=null; LIVE.ready=true; D.attachments=j.attachments||[]; liveBar(); return liveGate('',{empty:true}); }
    D=j.data; D.attachments=j.attachments||[]; LIVE.meta=j.meta; LIVE.version=j.meta.version; LIVE.dirty=false; LIVE.ready=true;
    lset('kl-report',LIVE.report); history.replaceState(null,'','?r='+encodeURIComponent(LIVE.report));
    LIVE.conflict=null; LIVE.rev=0; liveUngate(); render(); liveBar(); if(!quiet) toast(`Loaded ${LIVE.report} · version ${j.meta.version}`);
  }catch(e){ liveBusy(false); liveGate('Could not load the report: '+e.message,{err:true}); }
}
let liveAutoT=null;
function liveAutoSoon(ms){ clearTimeout(liveAutoT); liveAutoT=setTimeout(()=>{ if(LIVE.dirty&&LIVE.ready&&!LIVE.conflict) liveSave('auto'); }, ms||8000); }
async function liveSave(force){
  const auto=force==='auto'; if(auto) force=false;
  if(LIVE.saving){ if(auto||!force) { LIVE.again=true; return; } }
  if(LIVE.busy&&!auto) return;
  let note='Auto-save';
  if(!auto){ note=force?LIVE._note:prompt('Save to team — optional note for the Change Log (what did you change?)', ''); if(note===null) return; LIVE._note=note=note||'Saved'; }
  const rev=LIVE.rev||0; LIVE.saving=true; liveBar();
  if(!auto) liveBusy(true,'Saving to Google Drive…');
  try{ D.savedAt=new Date().toISOString(); const data=Object.assign({},D); delete data.attachments;
    const j=await liveCall('save',{data,note,baseVersion:LIVE.version,force:!!force,title:(D.meta&&D.meta.reportTitle||'')+' · '+(D.meta&&D.meta.period||'')});
    LIVE.meta=j.meta; LIVE.version=j.meta.version; LIVE.reports[LIVE.report]=j.meta; LIVE.conflict=null; LIVE.saving=false;
    LIVE.dirty=(LIVE.rev||0)!==rev; liveBusy(false); liveBar(); if(!auto) toast(`Saved for the team · version ${j.meta.version}`);
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    if(LIVE.dirty||LIVE.again){ LIVE.again=false; if(LIVE.dirty) liveAutoSoon(3000); }
  }catch(e){ liveBusy(false); LIVE.saving=false;
    if(auto){ if(e.code==='conflict'){ LIVE.conflict=e.data.current||{}; liveBar(); toast(`${LIVE.conflict.by||'Someone'} saved a newer version — click ☁ Save to choose which to keep`); }
      else { LIVE.offlineErr=e.message; liveBar(); liveAutoSoon(30000); } return; }
    if(e.code==='conflict'){ const c=e.data.current||{}; if(confirm(`${c.by||'Someone'} saved a newer version (v${c.version}) at ${new Date(c.at).toLocaleString('en-GB')} after you opened the report.\n\nOK = overwrite with your version\nCancel = keep theirs (reload the report; your unsaved edits are lost)`)) return liveSave(true); return liveLoad(); }
    alert('Could not save: '+e.message+'\nYour edits are still on this page — try again, or use Download HTML to keep a copy.'); }
}
function liveAttach(secId){
  const sec=document.getElementById(secId), title=sec?((sec.querySelector('h2')||{}).textContent||secId).trim():secId;
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=async()=>{ const files=[...inp.files]; if(!files.length) return; const big=files.find(f=>f.size>25*1024*1024); if(big) return alert(big.name+' is larger than 25 MB.');
    const note=prompt(`Attach ${files.length} file${files.length>1?'s':''} to “${title}”.\nOptional note for the Records sheet:`,''); if(note===null) return;
    for(const [i,f] of files.entries()){ liveBusy(true,`Uploading ${f.name} (${i+1}/${files.length})…`);
      try{ const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(f); });
        const j=await liveCall('upload',{section:secId,sectionTitle:title,name:f.name,mime:f.type||'application/octet-stream',b64,note});
        (D.attachments=D.attachments||[]).push(j.attachment);
      }catch(e){ liveBusy(false); alert('Upload failed for '+f.name+': '+e.message); return render(); } }
    liveBusy(false); render(); autosave(); toast('Saved to Google Drive and logged in the Records sheet'); };
  inp.click();
}
async function liveRemoveAtt(fid){
  const a=(D.attachments||[]).find(x=>x.id===fid); if(!a||!confirm(`Remove “${a.name}” from the report?\nThe file goes to the Drive trash and the Records sheet keeps the entry marked “Removed”.`)) return;
  liveBusy(true,'Removing…'); try{ await liveCall('remove',{fileId:fid}); D.attachments=D.attachments.filter(x=>x.id!==fid); liveBusy(false); render(); autosave(); toast('Removed'); }catch(e){ liveBusy(false); alert('Could not remove: '+e.message); }
}
function liveNewMonth(){
  const id=prompt('New report month (format YYYY-MM, e.g. 2026-11):',''); if(!id) return liveBar();
  if(!/^\d{4}-\d{2}$/.test(id.trim())) { alert('Please use the format YYYY-MM.'); return liveBar(); }
  if(LIVE.reports[id.trim()]){ location.search='?r='+encodeURIComponent(id.trim()); return; }
  const per=prompt('Reporting period shown in the report (e.g. November 2026):', new Date(id.trim()+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})); if(!per) return liveBar();
  if(!confirm(`Create ${id.trim()} as a copy of ${LIVE.report} (${D.meta.period})?\nSupporting files are not copied. The team then updates the figures and saves.`)) return liveBar();
  const old=D.meta.period; D=JSON.parse(JSON.stringify(D)); D.attachments=[];
  D.meta.period=per; if(D.meta.purpose) D.meta.purpose=String(D.meta.purpose).split(old).join(per);
  LIVE.report=id.trim(); LIVE.version=0; LIVE.meta=null; LIVE.dirty=true; history.replaceState(null,'','?r='+encodeURIComponent(LIVE.report)); lset('kl-report',LIVE.report);
  render(); liveBar(); toast('New month created — saving to Google…'); liveAutoSoon(1000);
}
function liveMenu(){
  openModalHtml('Team copy',`<div class="lv-menu">
    <p>Signed in as <b>${esc(LIVE.user)}</b> · report <b>${esc(LIVE.report)}</b>${LIVE.meta?` · version ${LIVE.meta.version}, saved by ${esc(LIVE.meta.by)}`:''}</p>
    ${LIVE.links.folder?`<a class="fb-btn" href="${esc(LIVE.links.folder)}" target="_blank" rel="noopener">📁 Open the Google Drive folder</a>`:''}
    ${LIVE.links.sheet?`<a class="fb-btn" href="${esc(LIVE.links.sheet)}" target="_blank" rel="noopener">📊 Open the Records sheet (Change Log · Supporting Documents)</a>`:''}
    <button class="fb-btn" data-jump="support">📎 Supporting documents in this report (${(D.attachments||[]).length})</button>
    <button class="fb-btn" id="lvReload">↻ Reload the latest team version</button>
    <button class="fb-btn" id="lvImport">⬆ Replace the content from a report file (.html / .json)</button>
    <button class="fb-btn" id="lvJson">⬇ Download the data only (.json)</button>
    <button class="fb-btn" id="lvSignout">Sign out on this computer</button>
    <p class="small muted">Add, edit or remove pages in ✎ Edit mode, then click ☁ Save to team. Use ⎙ Export PDF for a printable copy and ⬇ Download HTML for an offline copy.</p></div>`);
}
function openModalHtml(eyebrow,html){ $('#mbox').innerHTML=`<div class="mh"><div><div class="eyebrow">${esc(eyebrow)}</div></div><button class="mx" data-close aria-label="Close">✕</button></div><div class="mb">${html}</div>`; $('#modal').hidden=false; }
function liveDecorate(){
  if(!LIVE) return; const A=D.attachments||[]; if(!A.length) return; const by={}; A.forEach(a=>{ (by[a.section]=by[a.section]||[]).push(a); });
  Object.keys(by).forEach(id=>{ const s=document.getElementById(id); if(!s||s.querySelector('.att-row')) return; const h=s.querySelector('.ph')||s.firstElementChild; if(!h) return;
    h.insertAdjacentHTML('afterend',`<div class="att-row"><span class="att-l">📎 Supporting documents</span>${by[id].map(a=>`<span class="att-chip"><a href="${esc(a.url)}" target="_blank" rel="noopener" title="Uploaded by ${esc(a.by)} · ${esc(lvDate(a.at))}${a.note?' · '+esc(a.note):''}">${esc(a.name)}</a>${EDIT?`<button class="att-x" data-attrm="${esc(a.id)}" title="Remove" aria-label="Remove ${esc(a.name)}">✕</button>`:''}</span>`).join('')}</div>`); });
}
if(LIVE){ const _render=render; render=function(){ _render.apply(this,arguments); try{ liveDecorate(); }catch(e){} };
  document.addEventListener('click',e=>{ const t=e.target; let b;
    if(b=t.closest('[data-attach]')){ e.preventDefault(); e.stopPropagation(); if(!LIVE.ready) return alert('Connect to the team copy first.'); return liveAttach(b.dataset.attach); }
    if(b=t.closest('[data-attrm]')){ e.preventDefault(); e.stopPropagation(); return liveRemoveAtt(b.dataset.attrm); }
    if(t.closest('#lvSave')) return liveSave(false);
    if(t.closest('#lvMenu')) return liveMenu();
    if(t.closest('#lvReload')){ $('#modal').hidden=true; if(LIVE.dirty&&!confirm('Discard your unsaved changes and reload the team version?')) return; return liveLoad(); }
    if(t.closest('#lvImport')){ $('#modal').hidden=true; return $('#fileImport').click(); }
    if(t.closest('#lvJson')){ $('#modal').hidden=true; return $('#btnJson').click(); }
    if(t.closest('#lvSignout')){ ['kl-key','kl-user'].forEach(k=>{try{localStorage.removeItem(k);}catch(err){}}); location.reload(); }
    if(t.closest('#lgOffline')){ liveUngate(); return; }
    if(t.closest('#lgGo')){ const a=document.getElementById('lgApi'); if(a){ LIVE.api=a.value.trim(); lset('kl-api',LIVE.api); }
      LIVE.key=(document.getElementById('lgKey').value||'').trim(); LIVE.user=(document.getElementById('lgUser').value||'').trim();
      if(!LIVE.key||!LIVE.user) return liveGate('Please enter the passcode and your name.',{err:true}); if(!LIVE.api) return liveGate('Please enter the server address.',{err:true});
      lset('kl-key',LIVE.key); lset('kl-user',LIVE.user); return liveConnect(); }
  },true);
  document.addEventListener('change',e=>{ const t=e.target;
    if(t.id==='lvReport'){ if(t.value==='__new') return liveNewMonth(); if(LIVE.dirty&&!confirm('You have unsaved changes. Switch month anyway?')) return liveBar(); LIVE.report=t.value; return liveLoad(); }
    if(t.id==='lgImport'&&t.files[0]){ const rd=new FileReader(); rd.onload=()=>{ try{ let txt=rd.result, obj; if(/^\s*</.test(txt)){ const m=txt.match(/<script id="report-data" type="application\/json">([\s\S]*?)<\/script>/); if(!m) throw new Error('No report data in that file.'); obj=JSON.parse(m[1]); } else obj=JSON.parse(txt);
        if(!obj.meta||!obj.projects) throw new Error('This is not a monthly report file.'); const att=D.attachments||[]; D=obj; D.attachments=att; LIVE.dirty=true; liveUngate(); render(); liveBar(); LIVE.rev=(LIVE.rev||0)+1; toast('Report loaded — saving to Google…'); liveAutoSoon(1200); }catch(err){ alert('Could not load that file: '+err.message); } }; rd.readAsText(t.files[0]); }
  },true);
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.closest&&e.target.closest('#liveGate')&&e.target.tagName==='INPUT'){ e.preventDefault(); const g=document.getElementById('lgGo'); if(g) g.click(); } if((e.ctrlKey||e.metaKey)&&e.key==='s'&&LIVE.ready){ e.preventDefault(); liveSave(false); } });
  window.addEventListener('beforeunload',e=>{ if(LIVE.dirty){ e.preventDefault(); e.returnValue=''; } });
}

/* ============================== start ============================== */
try{ if(!LIVE){ const dr=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(dr && dr.meta && (!D.savedAt || dr.savedAt>D.savedAt) && JSON.stringify(Object.assign({},dr,{savedAt:0,_draft:0}))!==JSON.stringify(Object.assign({},D,{savedAt:0,_draft:0}))) draftOffer=dr; } }catch(e){}
render();
if(LIVE){ document.body.classList.add('lv-on'); liveBar(); liveConnect();
  $('#btnEdit').addEventListener('click',()=>{ setTimeout(()=>{ if(!EDIT&&LIVE.dirty&&LIVE.ready&&!LIVE.conflict) liveSave('auto'); },50); });
  /* keep in step with the team: every 45 s check whether someone else saved a newer version */
  setInterval(async()=>{ if(!LIVE.ready||LIVE.busy||LIVE.saving||document.hidden) return;
    try{ const j=await liveCall('ping'); LIVE.reports=j.reports||LIVE.reports; const cur=(j.reports||{})[LIVE.report];
      if(cur&&cur.version>LIVE.version){ if(!LIVE.dirty&&!EDIT){ const y=window.scrollY; await liveLoad(true); window.scrollTo(0,y); toast(`Updated with ${cur.by||'a team member'}'s changes (v${cur.version})`); }
        else if(!LIVE.dirty&&EDIT){ LIVE.conflict=null; LIVE.newer=cur; toast(`${cur.by||'Someone'} saved v${cur.version} — leave Edit mode to see it`); }
        else { LIVE.conflict=cur; liveBar(); } }
      LIVE.offlineErr=null; liveBar();
    }catch(e){} }, 45000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&LIVE.dirty&&LIVE.ready&&!LIVE.conflict) liveSave('auto'); });
}
window.__report = { get data(){ return D; }, render, openModal, VIEW };
})();
</script>
